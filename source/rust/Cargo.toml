[package]
name = "aisearch-emulator"
description = "Local HTTP-compatible emulator for Azure AI Search"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
axum = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
all = { level = "warn", priority = -100 }
pedantic = { level = "warn", priority = -99 }
unwrap_used = "deny"
expect_used = "deny"
