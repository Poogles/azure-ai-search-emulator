[package]
name = "aisearch-emulator"
description = "Local HTTP-compatible emulator for Azure AI Search"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
# Pure-Rust date/time library for the filter date functions
# (`dateadd` / `datediff` / `datepart` / `utcdatetime`).
chrono = "0.4"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default features disabled to avoid the C-based `zstd` compression dependency
# (which fails to link in the Nix build environment). Only pure-Rust features
# needed for the English text analyzer are enabled.
tantivy = { version = "0.26", default-features = false, features = ["mmap", "stopwords", "stemmer"] }
# Pure-Rust HNSW approximate-nearest-neighbour index for vector search. The
# `simdeez_f` feature enables SIMD distance kernels when built with
# `RUSTFLAGS=-C target-cpu=native`; it is opt-in and not required for
# correctness (see docs/decisions/0004-vector-index.md).
hnsw_rs = { version = "0.3", features = ["simdeez_f"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
all = { level = "warn", priority = -100 }
pedantic = { level = "warn", priority = -99 }
unwrap_used = "deny"
expect_used = "deny"
