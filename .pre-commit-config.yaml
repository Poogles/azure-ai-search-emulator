repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-ast
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: debug-statements
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^source/tests/python/
        exclude: ms_samples/upstream
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--config-file=source/tests/python/pyproject.toml]
        additional_dependencies:
          - azure-search-documents==12.0.0
          - pytest>=8.0
          - testcontainers>=4.0
        files: ^source/tests/python/
        exclude: ms_samples/upstream
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --manifest-path source/rust/Cargo.toml -- --check
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --manifest-path source/rust/Cargo.toml --all-targets -- -D warnings
        pass_filenames: false
