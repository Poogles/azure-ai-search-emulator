name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path source/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path source/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path source/rust/Cargo.toml --all-targets

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aisearch-emulator source/rust
      - name: Verify image size
        run: |
          SIZE=$(docker image inspect aisearch-emulator --format '{{.Size}}')
          LIMIT=$((20 * 1024 * 1024))
          echo "Image size: $SIZE bytes (limit: $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Image exceeds 20 MB limit"
            exit 1
          fi

  e2e:
    name: E2E tests (Python SDK)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          python-versions: "3.12"
      - name: Install dependencies
        working-directory: source/tests/python
        run: poetry install --no-interaction
      - name: Build Docker image
        run: docker build -t aisearch-emulator source/rust
      - name: Run E2E tests
        working-directory: source/tests/python
        run: poetry run pytest tests/e2e -v
