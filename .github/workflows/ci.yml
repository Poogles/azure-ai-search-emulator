name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path source/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path source/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path source/rust/Cargo.toml --all-targets

  python:
    name: Python harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          python-versions: "3.12"
      - name: Install dependencies
        working-directory: source/tests/python
        run: poetry install --no-interaction
      - name: Collect tests
        working-directory: source/tests/python
        run: poetry run pytest --collect-only
